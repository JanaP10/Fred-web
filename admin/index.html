<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fred | Admin</title><link rel="stylesheet" href="/styles.css"><style>
body{background:#f7f2e8}.admin{max-width:980px;margin:4vh auto;padding:24px}.panel{background:#fff;padding:34px;border-radius:24px;border:1px solid #d9dfda}.admin label{display:grid;gap:7px;font-weight:700}.admin input,.admin textarea{padding:13px;border:1px solid #cfd8d2;border-radius:12px;font:inherit;width:100%;box-sizing:border-box}.admin textarea{min-height:110px;resize:vertical}.hidden{display:none}.status{margin:16px 0;font-weight:700}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.tab{border:1px solid #cfd8d2;background:#fff;border-radius:999px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:700}.tab.active{background:#17352f;color:#fff}.edit-section{display:none}.edit-section.active{display:block}.field-card{background:#faf8f3;border:1px solid #e4e7e4;border-radius:18px;padding:18px;margin:14px 0}.field-card h3{margin:0 0 12px}.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lang{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.65}.savebar{position:sticky;bottom:12px;background:rgba(255,255,255,.95);border:1px solid #d9dfda;border-radius:18px;padding:12px 14px;margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 25px rgba(0,0,0,.08)}.hint{font-size:14px;opacity:.7;margin:0}.loginbox{max-width:500px;margin:auto}@media(max-width:700px){.field-pair{grid-template-columns:1fr}.panel{padding:20px}.savebar{align-items:stretch;flex-direction:column}.savebar .btn{width:100%}}</style></head><body><main class="admin"><div class="topbar"><a class="brand" href="/">Fred<span>.</span></a><a class="text-link" href="/" target="_blank">View website ↗</a></div><div class="panel"><section id="login" class="loginbox"><h1>Website editor</h1><p>Private access for Fred.</p><form id="login-form"><label>Password<div style="display:flex;gap:8px"><input id="password" type="password" required autocomplete="current-password" style="flex:1"><button id="show-password" type="button" class="btn btn-outline" style="padding:10px 14px">Show</button></div></label><button class="btn" style="margin-top:16px">Log in</button></form></section><section id="editor" class="hidden"><h1>Edit website</h1><p>Choose a section. English and French are shown side by side.</p><div class="tabs" id="tabs"></div><form id="content-form"><div id="fields"></div><div class="savebar"><div><strong>Ready?</strong><p class="hint">Changes go live after publishing.</p></div><button class="btn" type="submit">Save & Publish</button></div></form></section><p id="status" class="status"></p></div></main><script>document.getElementById("show-password").addEventListener("click",function(){const p=document.getElementById("password"),show=p.type==="password";p.type=show?"text":"password";this.textContent=show?"Hide":"Show"});</script><script src="/admin/admin.js"></script></body></html>
