<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fred | Admin</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f7f2e8}.admin{max-width:900px;margin:5vh auto;padding:24px}.panel{background:#fff;padding:32px;border-radius:24px;border:1px solid #d9dfda}.admin label{display:grid;gap:7px;margin:15px 0;font-weight:700}.admin input,.admin textarea{padding:13px;border:1px solid #cfd8d2;border-radius:12px;font:inherit;width:100%;box-sizing:border-box}.admin textarea{min-height:100px;resize:vertical}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.edit-section{border-top:1px solid #e4e7e4;margin-top:28px;padding-top:20px}.edit-section h2{margin-bottom:4px}.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.status{margin-top:16px;font-weight:600}@media(max-width:700px){.field-pair,.admin-grid{grid-template-columns:1fr}.panel{padding:22px}}</style></head><body><main class="admin"><a class="brand" href="/">Fred<span>.</span></a><div class="panel"><section id="login"><h1>Admin</h1><p>Private access for Fred.</p><form id="login-form"><label>Password<div style="display:flex;gap:8px"><input id="password" type="password" required autocomplete="current-password" style="flex:1"><button id="show-password" type="button" class="btn btn-outline" style="padding:10px 14px">Show</button></div></label><button class="btn">Log in</button></form></section><section id="editor" class="hidden"><h1>Edit website</h1><p>Edit the English and French text below, then click Save & Publish.</p><form id="content-form"><div id="fields"></div><button class="btn" type="submit">Save & Publish</button></form></section><p id="status" class="status"></p></div></main><script>document.getElementById("show-password").addEventListener("click",function(){const p=document.getElementById("password");const show=p.type==="password";p.type=show?"text":"password";this.textContent=show?"Hide":"Show";});</script><script src="/admin/admin.js"></script></body></html>
