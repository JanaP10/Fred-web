<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fred | Admin</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f7f2e8}.admin{max-width:760px;margin:8vh auto;padding:24px}.panel{background:#fff;padding:32px;border-radius:24px;border:1px solid #d9dfda}.admin label{display:grid;gap:7px;margin:15px 0;font-weight:700}.admin input{padding:13px;border:1px solid #cfd8d2;border-radius:12px;font:inherit}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.status{margin-top:16px}</style></head><body><main class="admin"><a class="brand" href="/">Fred<span>.</span></a><div class="panel"><section id="login"><h1>Admin</h1><p>Private access for Fred.</p><form id="login-form"><label>Password<div style="display:flex;gap:8px"><input id="password" type="password" required autocomplete="current-password" style="flex:1"><button id="show-password" type="button" class="btn btn-outline" style="padding:10px 14px">Show</button></div></label><button class="btn">Log in</button></form></section><section id="editor" class="hidden"><h1>Lesson prices</h1><p>Update the public prices, then publish.</p><form id="price-form"><div class="admin-grid"><label>TEF Canada<input name="tef" required></label><label>French<input name="fr" required></label><label>English<input name="en" required></label><label>Conversation<input name="conversation" required></label></div><button class="btn">Save & Publish</button></form></section><p id="status" class="status"></p></div></main><script>document.getElementById("show-password").addEventListener("click",function(){const p=document.getElementById("password");const show=p.type==="password";p.type=show?"text":"password";this.textContent=show?"Hide":"Show";});</script><script src="/admin/admin.js"></script></body></html>
