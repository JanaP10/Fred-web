<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fred | Admin</title><link rel="stylesheet" href="/styles.css"><style>
body{background:#f7f2e8}.admin{max-width:1280px;margin:3vh auto;padding:24px}.panel{background:#fff;padding:32px;border-radius:24px;border:1px solid #d9dfda}.hidden{display:none}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.loginbox{max-width:500px;margin:auto}.admin label{display:grid;gap:7px;font-weight:700}.admin input,.admin textarea{padding:13px;border:1px solid #cfd8d2;border-radius:12px;font:inherit;width:100%;box-sizing:border-box}.admin textarea{min-height:110px;resize:vertical}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tab{border:1px solid #cfd8d2;background:#fff;border-radius:999px;padding:9px 15px;cursor:pointer;font:inherit;font-weight:700}.tab.active{background:#17352f;color:#fff}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,.9fr);gap:24px;align-items:start}.edit-section{display:none}.edit-section.active{display:block}.field-card{background:#faf8f3;border:1px solid #e4e7e4;border-radius:18px;padding:18px;margin:0 0 14px}.field-card h3{margin:0 0 12px}.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lang{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.65}.preview-wrap{position:sticky;top:18px;border:1px solid #d9dfda;border-radius:20px;overflow:hidden;background:#fff}.preview-head{padding:12px 14px;background:#faf8f3;display:flex;justify-content:space-between;align-items:center}.preview-lang{display:flex;gap:6px}.preview-lang button{border:1px solid #cfd8d2;background:#fff;border-radius:999px;padding:6px 10px;cursor:pointer}.preview-lang button.active{background:#17352f;color:#fff}.preview-frame{width:100%;height:650px;border:0;display:block}.savebar{position:sticky;bottom:10px;background:rgba(255,255,255,.96);border:1px solid #d9dfda;border-radius:18px;padding:12px 14px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 25px rgba(0,0,0,.08);z-index:3}.hint{font-size:14px;opacity:.7;margin:0}.status{margin:14px 0;font-weight:700}.dirty{font-size:13px;color:#7a5b16}@media(max-width:900px){.workspace{grid-template-columns:1fr}.preview-wrap{position:relative;top:auto;order:-1}.preview-frame{height:480px}}@media(max-width:650px){.admin{padding:12px}.panel{padding:18px}.field-pair{grid-template-columns:1fr}.preview-frame{height:390px}.savebar{flex-direction:column;align-items:stretch}.savebar .btn{width:100%}}</style></head><body><main class="admin"><div class="topbar"><a class="brand" href="/">Fred<span>.</span></a><a class="text-link" href="/" target="_blank">View website ↗</a></div><div class="panel"><section id="login" class="loginbox"><h1>Website editor</h1><p>Private access for Fred.</p><form id="login-form"><label>Password<div style="display:flex;gap:8px"><input id="password" type="password" required autocomplete="current-password" style="flex:1"><button id="show-password" type="button" class="btn btn-outline" style="padding:10px 14px">Show</button></div></label><button class="btn" style="margin-top:16px">Log in</button></form></section><section id="editor" class="hidden"><h1>Edit website</h1><p>Choose a section, edit English or French, and check the preview before publishing.</p><div class="tabs" id="tabs"></div><form id="content-form"><div class="workspace"><div id="fields"></div><aside class="preview-wrap"><div class="preview-head"><strong>Preview</strong><div class="preview-lang"><button type="button" id="preview-en" class="active">EN</button><button type="button" id="preview-fr">FR</button></div></div><iframe id="preview-frame" class="preview-frame" src="/" title="Website preview"></iframe></aside></div><div class="savebar"><div><strong id="save-title">No unpublished changes</strong><p class="hint">Nothing goes live until you publish.</p></div><button class="btn" id="publish-btn" type="submit">Save & Publish</button></div></form></section><p id="status" class="status"></p></div></main><script>document.getElementById("show-password").addEventListener("click",function(){const p=document.getElementById("password"),show=p.type==="password";p.type=show?"text":"password";this.textContent=show?"Hide":"Show"});</script><script src="/admin/admin.js"></script></body></html>
